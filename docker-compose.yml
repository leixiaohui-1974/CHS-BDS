  #   environment:
  #     - POSTGRES_USER=chsbds
  #     - POSTGRES_PASSWORD=chsbds_password
  #     - POSTGRES_DB=chsbds
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Optional: Web dashboard (future feature)
  # dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.dashboard
  #   container_name: chs-bds-dashboard
  #   ports:
  #     - "8050:8050"
  #   depends_on:
  #     - chs-bds
  #     - postgres
  #   restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: chs-bds-network
    driver: bridge
